name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Type-check (including tests)
        run: npm run typecheck

      - name: Run Test Suite (unit, regression, golden, property-based)
        run: npm test

      - name: Golden output through the built CLI
        run: npm run test:golden

      - name: Coverage gate (compiler)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Audit Dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm audit --audit-level=high

      - name: Run Performance Benchmarks
        run: npm run bench

  e2e:
    name: End-to-end (Playwright, Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Playwright tests against the production build
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/ide/playwright-report
          retention-days: 7
