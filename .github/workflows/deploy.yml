name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Only deploy a build that passes the full CI suite.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: ci
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './packages/ide/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
